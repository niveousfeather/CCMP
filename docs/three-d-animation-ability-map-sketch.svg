<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 38px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .sub { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5a6475; }
      .h2 { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a3d; }
      .h3 { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a3d; }
      .text { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #354052; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4d596b; }
      .tiny { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #627086; }
      .panel { fill: #ffffff; stroke: #d9dfeb; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #cfd7e6; stroke-width: 2; }
      .dash { fill: #ffffff; stroke: #b7c2d8; stroke-width: 2; stroke-dasharray: 8 8; }
      .blue { fill: #e7f0ff; stroke: #78a7f5; }
      .teal { fill: #e3f7f3; stroke: #60bfae; }
      .amber { fill: #fff3d8; stroke: #e7ae45; }
      .rose { fill: #ffe8eb; stroke: #e97887; }
      .violet { fill: #f0eaff; stroke: #9f87e8; }
      .green { fill: #eaf8e5; stroke: #76bc63; }
      .line { stroke: #8d98aa; stroke-width: 2.4; fill: none; }
      .arrow { stroke: #4b5d79; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .label { fill: #172033; font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5d79"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text class="title" x="80" y="72">三维动画专业课程能力图谱可视化草图</text>
  <text class="sub" x="82" y="108">以《动画运动规律》为样例：岗位项目驱动 · 三维目标支撑 · 岗课赛证评价闭环</text>

  <rect class="panel" x="70" y="145" rx="10" ry="10" width="300" height="650"/>
  <text class="h2" x="105" y="192">岗位 / 项目载体</text>
  <rect class="dash" x="100" y="220" rx="12" ry="12" width="240" height="105"/>
  <text class="h3" x="125" y="257">典型岗位群</text>
  <text class="small" x="125" y="287">三维动画师 · 动捕师</text>
  <text class="small" x="125" y="312">面捕师 · 虚拟制片助理</text>

  <rect class="dash" x="100" y="350" rx="12" ry="12" width="240" height="125"/>
  <text class="h3" x="125" y="386">真实项目载体</text>
  <text class="small" x="125" y="416">三维动画短片创作</text>
  <text class="small" x="125" y="443">角色运动设计与制作</text>
  <text class="small" x="125" y="470">动捕 / 面捕数据应用</text>

  <rect class="dash" x="100" y="500" rx="12" ry="12" width="240" height="190"/>
  <text class="h3" x="125" y="536">反向设计逻辑</text>
  <text class="small" x="125" y="568">产业需求</text>
  <text class="small" x="125" y="598">岗位任务</text>
  <text class="small" x="125" y="628">能力要求</text>
  <text class="small" x="125" y="658">课程内容</text>
  <path class="arrow" d="M 222 575 L 222 646"/>

  <rect class="panel" x="420" y="145" rx="10" ry="10" width="760" height="650"/>
  <text class="h2" x="455" y="192">项目—任务—流程—能力—技能—知识 六级图谱</text>
  <text class="tiny" x="456" y="219">中心主线建议按“三维动画生产流程”排布，课程能力点挂接到对应工作环节。</text>

  <rect class="card blue" x="455" y="255" rx="12" ry="12" width="185" height="150"/>
  <text class="label" x="485" y="288">01 常规运动</text>
  <text class="small" x="480" y="320">关键帧设置</text>
  <text class="small" x="480" y="348">曲线编辑器</text>
  <text class="small" x="480" y="376">加速 / 减速 / 匀速</text>

  <rect class="card teal" x="665" y="255" rx="12" ry="12" width="185" height="150"/>
  <text class="label" x="695" y="288">02 自然运动</text>
  <text class="small" x="690" y="320">曲线运动</text>
  <text class="small" x="690" y="348">惯性与跟随</text>
  <text class="small" x="690" y="376">节奏调试</text>

  <rect class="card amber" x="875" y="255" rx="12" ry="12" width="185" height="150"/>
  <text class="label" x="905" y="288">03 骨骼动画</text>
  <text class="small" x="900" y="320">CS骨骼对位</text>
  <text class="small" x="900" y="348">IK解算器</text>
  <text class="small" x="900" y="376">绑定 / 蒙皮 / 权重</text>

  <path class="arrow" d="M 640 330 L 660 330"/>
  <path class="arrow" d="M 850 330 L 870 330"/>

  <rect class="card rose" x="560" y="450" rx="12" ry="12" width="230" height="160"/>
  <text class="label" x="600" y="484">04 动捕动画</text>
  <text class="small" x="590" y="518">传感器调试与校准</text>
  <text class="small" x="590" y="548">动作采集与清洗</text>
  <text class="small" x="590" y="578">VR / AR 动画展示</text>

  <rect class="card violet" x="825" y="450" rx="12" ry="12" width="230" height="160"/>
  <text class="label" x="865" y="484">05 表情面捕</text>
  <text class="small" x="855" y="518">表情状态预设</text>
  <text class="small" x="855" y="548">面捕设备调试</text>
  <text class="small" x="855" y="578">数据重定向与优化</text>

  <path class="arrow" d="M 735 405 C 725 420 700 425 680 445"/>
  <path class="arrow" d="M 965 405 C 975 420 965 425 940 445"/>
  <path class="arrow" d="M 790 530 L 820 530"/>

  <rect class="card green" x="515" y="655" rx="12" ry="12" width="585" height="90"/>
  <text class="label" x="548" y="690">课程成果输出</text>
  <text class="small" x="548" y="723">运动规律分析表 · 动画片段 · 动捕数据包 · 表情库 · 三维动画短片展示</text>

  <path class="arrow" d="M 1098 330 C 1160 330 1160 330 1220 330"/>
  <path class="arrow" d="M 1098 530 C 1160 530 1160 530 1220 530"/>
  <path class="arrow" d="M 370 470 C 390 470 392 470 415 470"/>

  <rect class="panel" x="1230" y="145" rx="10" ry="10" width="300" height="650"/>
  <text class="h2" x="1265" y="192">岗课赛证评价闭环</text>

  <rect class="card blue" x="1265" y="225" rx="12" ry="12" width="230" height="78"/>
  <text class="label" x="1290" y="256">岗</text>
  <text class="small" x="1325" y="256">对接企业真实任务</text>
  <text class="tiny" x="1325" y="280">动画制作 / 动捕 / 面捕岗位</text>

  <rect class="card teal" x="1265" y="325" rx="12" ry="12" width="230" height="78"/>
  <text class="label" x="1290" y="356">课</text>
  <text class="small" x="1325" y="356">对应教学模块与学时</text>
  <text class="tiny" x="1325" y="380">项目化、模块化、任务链</text>

  <rect class="card amber" x="1265" y="425" rx="12" ry="12" width="230" height="78"/>
  <text class="label" x="1290" y="456">赛</text>
  <text class="small" x="1325" y="456">对应竞赛考核要求</text>
  <text class="tiny" x="1325" y="480">数字艺术 / AIGC / VR 应用</text>

  <rect class="card violet" x="1265" y="525" rx="12" ry="12" width="230" height="78"/>
  <text class="label" x="1290" y="556">证</text>
  <text class="small" x="1325" y="556">对应职业技能等级</text>
  <text class="tiny" x="1325" y="580">动画制作员 / 数字创意建模</text>

  <rect class="card green" x="1265" y="625" rx="12" ry="12" width="230" height="92"/>
  <text class="label" x="1290" y="656">评</text>
  <text class="small" x="1325" y="656">过程性 + 终结性评价</text>
  <text class="tiny" x="1325" y="681">企业标准、作品验收、岗位适配度</text>

  <rect class="panel" x="70" y="830" rx="10" ry="10" width="1460" height="100"/>
  <text class="h2" x="105" y="870">三维课程目标支撑层</text>
  <text class="text" x="360" y="870">素质：艺术素养、数字素养、规范操作、精益求精、团队协作</text>
  <text class="text" x="360" y="902">知识：运动规律、骨骼绑定、IK、动捕设备、面捕控制器、VR/AR展示</text>
  <text class="text" x="930" y="902">能力：动作设计、权重调试、数据采集、重定向、动画优化、项目交付</text>
</svg>
